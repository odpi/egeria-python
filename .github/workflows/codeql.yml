name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of push/PR activity -- catches newly published
    # CodeQL query/advisory updates against unchanged code.
    - cron: '0 7 * * 1'

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload results to the Security tab.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
          # Scoped to real package source -- excludes vendored/generated
          # content and sample data that would otherwise dominate results
          # with noise from third-party or non-shipped code.
          # codeql-action v4 dropped the flat paths/paths-ignore init inputs
          # (confirmed via the action's own "Unexpected input(s)" warning on
          # PR #360) -- same path-scoping now goes under an inline `config:`
          # block instead.
          config: |
            paths:
              - pyegeria
              - md_processing
              - commands
              - my_egeria
            paths-ignore:
              - '**/data/**'
              - '**/*.json'

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:python"
