name: Dr.Egeria round-trip probe gate

# Before a pyegeria release: a scratch Egeria (in this runner only, never a shared platform) and a
# round trip of every Dr.Egeria Create command (PostgreSQL repository on a private network, Core Content
# Pack, the pyegeria-side REJECTED attributes sent), compared with the committed baseline
# (scripts/dr_egeria_roundtrip_probe/baseline/<egeria digest>.json). See that folder's README.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "odpi/egeria-platform image digest (default: the pin in scratch.py)"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'release') ||
      startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        version: "latest"

    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Probe gate (scratch up, round trip, compare, scratch down)
      env:
        DIGEST: ${{ github.event.inputs.digest }}
      run: |
        args=(--out "$RUNNER_TEMP/roundtrip-probe")
        if [ -n "$DIGEST" ]; then args+=(--digest "$DIGEST"); fi
        uv run python scripts/dr_egeria_roundtrip_probe/gate.py "${args[@]}"

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: roundtrip-probe-results
        path: |
          ${{ runner.temp }}/roundtrip-probe/RESULTS-*
        if-no-files-found: warn
