version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keeps the SHA-pinned `uses:` refs in .github/workflows/*.yml current --
    # Dependabot resolves the new tag to its commit SHA itself, so pinning
    # doesn't mean these go stale silently.
    groups:
      # codeql-action/init and codeql-action/analyze must run the same version
      # ("Loaded a configuration file for version X, but running version Y"),
      # so bump them in one PR -- separate PRs each fail CodeQL (#395/#396).
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
